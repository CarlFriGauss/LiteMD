CXX = "D:/rtools44/x86_64-w64-mingw32.static.posix/bin/g++.exe"
AR = "D:/projects/TextEditor/.cache/winlibs/lib.exe"
RC = "D:/projects/TextEditor/.cache/winlibs/rc.exe"
