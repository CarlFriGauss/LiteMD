[package]
name = "litemd"
version = "0.1.0"
description = "LiteMD — Ultra-Lightweight Live-Preview Markdown & Math Editor"
authors = ["LiteMD Systems Engineering"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "litemd_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true
opt-level = 1

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = 3
